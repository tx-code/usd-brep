[project]
name = "usd-brep"
version = "0.0.0"
description = "SMLib BRep geometry SDK for CAM applications."
readme = "README.md"
license = "Apache-2.0 AND BSD-3-Clause AND MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.13"
dependencies = []
[project.urls]
Homepage = "https://github.com/tx-code/usd-brep"
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
include-package-data = true
[tool.setuptools.packages.find]
include = ["usd_brep*"]
namespaces = false
[tool.setuptools.package-data]
usd_brep = ["*.pyd", "*.dll", "*.so*", "*.pyi", "py.typed"]
